<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d1522" />

    <meta
      name="description"
      content="Football IQ — מבחן ידע כדורגל בעברית. בוחרים ליגות, קטגוריות ורמת קושי, עונים באמריקאי או בהקלדה חופשית, ומקבלים ציון אחד לשיתוף."
    />
    <title>Football IQ — מה ה-Football IQ שלכם?</title>

    <!-- Fonts are the only third-party request the app makes. -->

    <!-- The brand mark, not an emoji: identical on every platform. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%230d1522'/%3E%3Ccircle cx='24' cy='24' r='16.5' fill='none' stroke='%23f1f0ea' stroke-width='2'/%3E%3Cpath d='M24 14.5l6.3 4.6-2.4 7.4h-7.8L17.7 19z' fill='%2326c463'/%3E%3Cpath d='M24 14.5V8.6M17.7 19l-5.6-3.5M30.3 19l5.6-3.5M20.1 26.5l-3.6 6M27.9 26.5l3.6 6' stroke='%23f1f0ea' stroke-width='1.8' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />

    <!--
      THE BOOT LAYER.

      Everything in this block exists because the page used to be able to end up
      as a permanently white screen with nothing on it — no logo, no message, no
      way out but a reload the visitor had to think of themselves. Two mechanisms
      did that, and both were reproduced against production:

        1. a browser holding a previous deployment's index.html asked for a
           bundle hash that no longer existed. The SPA fallback answered with
           200 OK and this file, Content-Type text/html, and the browser refused
           it: "Expected a JavaScript-or-Wasm module script but the server
           responded with a MIME type of text/html." The stale stylesheet was
           missing too, so the page was not merely empty — it had no background
           either, which is why the report was "completely white".

        2. a render-time exception with no error boundary above it. React 19
           unmounts the entire root when that happens, which empties #root and
           leaves exactly the same blank page.

      The Worker now returns a real 404 for a missing hashed asset instead of
      HTML, which is what lets case 1 be detected at all. This block is what
      reacts to it, plus the floor under everything else:

        * a styled shell that is visible before any bundle arrives, with its CSS
          inline so it does not depend on the stylesheet that may be the thing
          that failed
        * the four startup stages, as a diagnosis aid that costs one global
        * window.onerror / unhandledrejection, so a failure is recorded rather
          than silent
        * a capture-phase listener for asset load failures, which do not bubble
        * a timeout, so "nothing happened at all" is also handled
        * a recovery screen with a retry that actually retries

      WRITTEN IN ES5 ON PURPOSE. No arrow functions, no template literals, no
      optional chaining. This is the code that has to run when the rest of the
      app could not, on whatever browser that turned out to be; a syntax error
      here would take out the very thing meant to catch the failure. It is also
      why it is inline rather than a file: a file is one more request that can be
      the one that fails.
    -->
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; padding: 0; }
      /* Set here as well as in the stylesheet, so a missing stylesheet is still
         a Football IQ background rather than white. */
      body { background: #0d1522; color: #f1f0ea; font-family: "Rubik", "Assistant", system-ui, -apple-system, "Segoe UI", sans-serif; }

      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; padding: 24px; box-sizing: border-box;
        background: #0d1522; text-align: center;
      }
      #boot[hidden] { display: none; }
      .boot-ball { width: 56px; height: 56px; animation: boot-spin 1.4s linear infinite; }
      .boot-text { margin: 0; font-size: 15px; letter-spacing: 0.02em; color: #9aa6b8; }
      .boot-title { margin: 0; font-size: 19px; font-weight: 700; color: #f1f0ea; }
      .boot-body { margin: 0; max-width: 30ch; font-size: 14px; line-height: 1.6; color: #9aa6b8; }
      .boot-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 4px; }
      .boot-btn {
        font: inherit; font-size: 15px; font-weight: 600;
        padding: 11px 22px; border-radius: 999px; border: 1px solid transparent;
        cursor: pointer; text-decoration: none; display: inline-block;
        background: #26c463; color: #07140b;
      }
      .boot-btn-quiet { background: transparent; border-color: #2b3647; color: #f1f0ea; }
      .boot-code { margin: 6px 0 0; font-size: 11px; letter-spacing: 0.04em; color: #5b687a; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      /* The spinner is decoration; someone who asked for less motion gets a
         static mark rather than a moving one. */
      @media (prefers-reduced-motion: reduce) { .boot-ball { animation: none; } }
    </style>
  </head>
  <body>
    <!--
      Outside #root deliberately. React's createRoot clears its container on
      first render, so a shell placed inside it would be torn down by React
      rather than by code that knows whether startup actually succeeded.
    -->
    <div id="boot" role="status" aria-live="polite">
      <svg class="boot-ball" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="16.5" fill="none" stroke="#2b3647" stroke-width="2.5" />
        <path d="M24 14.5l6.3 4.6-2.4 7.4h-7.8L17.7 19z" fill="#26c463" />
        <path
          d="M24 14.5V8.6M17.7 19l-5.6-3.5M30.3 19l5.6-3.5M20.1 26.5l-3.6 6M27.9 26.5l3.6 6"
          stroke="#2b3647" stroke-width="2" fill="none" stroke-linecap="round"
        />
      </svg>
      <p class="boot-text">טוען את Football IQ…</p>
    </div>

    <div id="root"></div>

    <script nonce="__CSP_NONCE__">
      (function () {
        "use strict";

        /*
          The stage names are shared with src/client/lib/startup.ts, which owns
          the rest of the sequence. They have to match exactly: the boot layer
          records the first one before any bundle exists, and the module records
          the rest, so a mismatch would quietly split the timeline in two and
          leave the first stage orphaned.

          HTML_RECEIVED -> JS_STARTED -> REACT_MOUNTED -> HOME_RENDERED
            -> [STARTUP_REQUESTS_STARTED -> STARTUP_REQUESTS_FINISHED] -> APP_READY
        */
        var STAGES = { html: "HTML_RECEIVED", js: "JS_STARTED", mounted: "REACT_MOUNTED", ready: "APP_READY" };
        window.__FIQ_STAGE__ = STAGES.html;

        // Seeded here so the timeline is complete from the very first stage.
        // startup.ts appends to this same array rather than creating its own.
        window.__FIQ_TIMELINE__ = [{ stage: STAGES.html, at: 0 }];

        /** Diagnosis only. Bounded, so a failure loop cannot grow it without limit. */
        window.__FIQ_ERRORS__ = [];

        var boot = document.getElementById("boot");
        var settled = false;
        var timer = null;

        /**
         * One line per failure, with nothing in it that identifies anybody.
         *
         * Route, stage, error type, message and the first few stack frames. No
         * storage contents, no room code, no player name, no reconnect token —
         * a diagnostic that leaks what the visitor was doing is not one worth
         * having.
         */
        function note(kind, message, stack) {
          if (window.__FIQ_ERRORS__.length > 12) return;
          window.__FIQ_ERRORS__.push({
            kind: kind,
            stage: window.__FIQ_STAGE__,
            route: location.pathname,
            message: String(message || "").slice(0, 300),
            stack: String(stack || "").split("\n").slice(0, 4).join(" | ").slice(0, 600),
            at: Date.now()
          });
        }

        /**
         * Did we already try reloading for a stale shell?
         *
         * The guard matters more than the reload: an automatic reload that can
         * fire twice is a reload loop, which is worse than the white screen it
         * is trying to fix. Storage access is wrapped because the browsers where
         * this fires are disproportionately the ones that refuse storage — and
         * if it is refused, the answer is "do not auto-reload", which leaves the
         * visitor on the recovery screen with a button. That is the safe
         * direction.
         */
        function reloadAlreadyTried() {
          try {
            if (sessionStorage.getItem("fiq_boot_reloaded") === "1") return true;
            sessionStorage.setItem("fiq_boot_reloaded", "1");
            return false;
          } catch (e) {
            return true;
          }
        }

        function clearReloadGuard() {
          try { sessionStorage.removeItem("fiq_boot_reloaded"); } catch (e) {}
        }

        /** Replaces the shell with something that explains itself and offers a way on. */
        function recover(title, body) {
          if (settled || !boot) return;
          settled = true;
          if (timer) { clearTimeout(timer); timer = null; }

          boot.innerHTML = "";
          boot.removeAttribute("role");

          var heading = document.createElement("p");
          heading.className = "boot-title";
          heading.textContent = title;

          var text = document.createElement("p");
          text.className = "boot-body";
          text.textContent = body;

          var actions = document.createElement("div");
          actions.className = "boot-actions";

          var retry = document.createElement("button");
          retry.type = "button";
          retry.className = "boot-btn";
          retry.textContent = "נסו שוב";
          // A real retry: the failures this screen exists for are failures to
          // load, and the only thing that retries a load is a load. The guard is
          // cleared first so the fresh attempt is not treated as the second half
          // of an automatic one.
          retry.onclick = function () { clearReloadGuard(); location.reload(); };

          var home = document.createElement("a");
          home.className = "boot-btn boot-btn-quiet";
          home.href = "/";
          home.textContent = "חזרה לדף הבית";

          actions.appendChild(retry);
          actions.appendChild(home);
          boot.appendChild(heading);
          boot.appendChild(text);
          boot.appendChild(actions);

          /**
           * A short code, so an occurrence on a real phone is reportable.
           *
           * The whole difficulty with this bug has been that it happens on
           * somebody's handset and leaves nothing behind. Four fields — the
           * stage startup reached, why this screen appeared, and the engine —
           * are enough to tell the mechanisms apart, and none of them says
           * anything about the person holding the phone.
           */
          try {
            var last = (window.__FIQ_ERRORS__ && window.__FIQ_ERRORS__.length)
              ? window.__FIQ_ERRORS__[window.__FIQ_ERRORS__.length - 1]
              : null;
            var code = document.createElement("p");
            code.className = "boot-code";
            code.textContent =
              "קוד: " + (window.__FIQ_STAGE__ || "?") +
              " / " + ((last && last.kind) || "?") +
              " / " + (navigator.vendor || "?").slice(0, 12);
            boot.appendChild(code);
          } catch (e) {
            /* a diagnostic is never worth failing the recovery screen for */
          }
        }

        /**
         * Watches for the app becoming UNUSABLE after it rendered.
         *
         * THE BLIND SPOT THIS CLOSES. The first version of this guard asked only
         * whether #root had been emptied. That caught the failure known at the
         * time — an error thrown from a passive effect, which makes React unmount
         * the whole tree — but it is the wrong question for the symptom that kept
         * being reported afterwards: a DARK screen, with no content and no
         * recovery.
         *
         * Dark is not blank. White meant the stylesheet never arrived. Dark means
         * the stylesheet DID arrive and painted `body { background: #0d1522 }`, so
         * the app's own CSS is running. If the content is still in the DOM but
         * invisible — collapsed to no height, or hidden under a full-screen
         * element — then #root is full, the old guard saw nothing wrong, and the
         * visitor sat looking at a dark rectangle with nothing to press. That is
         * exactly "no content and no recovery".
         *
         * So the question is now visibility, asked three ways, because any one of
         * them alone has a failure mode:
         *
         *   text      #root still has something in it
         *   geometry  #root occupies real height
         *   hit test  something belonging to the app actually answers at the
         *             points a thumb would touch
         *
         * The hit test is the one that catches a curtain, and it is why the probe
         * asks whether the element at each point is INSIDE #root. Every
         * legitimate full-screen overlay in this product — the answer-mode sheet,
         * the privacy panel, the accessibility menu, the kickoff whistle — is
         * rendered by React inside #root, so all of them pass. The only
         * full-screen opaque thing outside #root is this boot layer itself.
         *
         * FALSE POSITIVES ARE THE REAL RISK HERE, because the cure is a screen
         * that replaces the product. Four things keep it quiet: it only runs
         * after a successful mount; it needs THREE consecutive bad samples two
         * seconds apart, so a route change that empties and refills the container
         * cannot trip it; a single good probe point is enough to pass; and it
         * stands down entirely while the tab is hidden, since a backgrounded page
         * in WebKit reports zero-sized boxes and absent hit targets as a matter
         * of course.
         */
        function appLooksUsable(root) {
          if (!root) return false;
          if ((root.textContent || "").trim() === "") return false;

          // Height, not width: a full-bleed column can legitimately be narrow,
          // but it can never legitimately be flat.
          var box = root.getBoundingClientRect ? root.getBoundingClientRect() : null;
          if (box && box.height < 24) return false;

          // Hit testing needs a laid-out viewport; without one, say nothing.
          var w = window.innerWidth, h = window.innerHeight;
          if (!w || !h) return true;
          if (typeof document.elementFromPoint !== "function") return true;

          /*
            A STUCK DECORATIVE CURTAIN, which the hit test cannot see.

            This is the gap that let the real bug through. The quiz's opening
            whistle is a 92%-opaque full-screen element with
            `pointer-events: none`, and that last property is the problem:
            elementFromPoint SKIPS a pointer-transparent element and returns
            what is behind it. So the probe found the quiz input, concluded the
            app was reachable, and reported health while the screen was dark.

            The test below asks the opposite question. An element that covers
            the whole viewport, is opaque, and cannot be interacted with is by
            definition not something the visitor can get past — no legitimate
            overlay in this product is pointer-transparent, because every one of
            them exists to be tapped. A flourish that is still there on three
            consecutive samples six seconds apart has not finished, and the app
            behind it is unreachable whatever the hit test says.

            Narrow on purpose: opaque AND full-viewport AND pointer-events:none.
            The scrims, sheets and panels all take pointer events and all pass.
          */
          var all = document.querySelectorAll("body *");
          for (var c = 0; c < all.length; c++) {
            var el = all[c];
            var cs = window.getComputedStyle ? window.getComputedStyle(el) : null;
            if (!cs) continue;
            if (cs.position !== "fixed" && cs.position !== "absolute") continue;
            if (cs.pointerEvents !== "none") continue;
            if (cs.display === "none" || cs.visibility === "hidden") continue;
            if (parseFloat(cs.opacity) < 0.6) continue;
            var bg = cs.backgroundColor || "";
            if (!bg || bg === "transparent" || bg.indexOf(", 0)") !== -1) continue;
            var cb = el.getBoundingClientRect();
            if (cb.width * cb.height >= w * h * 0.9) return false;
          }

          // Three points down the middle of the screen. One hit inside #root is
          // enough — the app does not have to cover every pixel, it only has to
          // be reachable somewhere.
          var ys = [Math.round(h * 0.3), Math.round(h * 0.5), Math.round(h * 0.7)];
          var x = Math.round(w * 0.5);
          for (var i = 0; i < ys.length; i++) {
            var hit = document.elementFromPoint(x, ys[i]);
            if (hit && (hit === root || root.contains(hit))) return true;
          }
          return false;
        }

        function watchForCollapse(root) {
          var strikes = 0;

          var check = function () {
            // A hidden tab is not a broken tab. WebKit reports collapsed boxes
            // and no hit targets for a backgrounded page, which would otherwise
            // look identical to the failure.
            if (document.visibilityState === "hidden") { strikes = 0; return; }
            // Once the recovery screen is up it owns the page; stop measuring.
            if (boot && !boot.hasAttribute("hidden")) return;

            if (appLooksUsable(root)) { strikes = 0; return; }

            strikes++;
            if (strikes < 3) return;

            note("post-mount-collapse", "app stopped being usable after a successful mount", "");
            // __FIQ_MOUNTED__ set this; clear it so recover() is allowed to run.
            settled = false;
            if (boot) boot.removeAttribute("hidden");
            recover(
              "המשחק נעלם מהמסך",
              "משהו הפסיק את המשחק אחרי שנטען. אפשר לנסות שוב."
            );
          };

          // Polled rather than driven by MutationObserver: the failure this is
          // for does not necessarily change the DOM at all. An element that
          // becomes invisible through a style change, or a curtain that was
          // always in the tree, produces no mutation worth waking for.
          var timerId = setInterval(check, 2000);

          // And stop after a few minutes. By then the page has long since proved
          // itself, and a timer that runs for the life of a tab is a cost with
          // nothing left to buy.
          setTimeout(function () { clearInterval(timerId); }, 180000);
        }

        /**
         * Called by main.tsx once React has actually put something on screen.
         *
         * "Mounted" is the only honest signal here. A bundle that parsed is not
         * an app that rendered, which is the distinction the old startup had no
         * way to make.
         */
        /**
         * Takes the shell down. The only place that does.
         *
         * Called by the app's handshake, and also by the self-check below when
         * it can see for itself that React has rendered. Idempotent, because
         * both paths may well fire.
         */
        var dismissed = false;
        function dismissShell(reason) {
          if (dismissed) return;
          dismissed = true;
          settled = true;
          if (timer) { clearTimeout(timer); timer = null; }
          if (boot) boot.setAttribute("hidden", "hidden");
          clearReloadGuard();

          /*
            Recorded, because "was the shell still up?" has been guesswork in
            every previous investigation of this bug.

            This overlay is the only element in the product that is opaque,
            full-screen AND outside #root, so it is the only thing that can hide
            a perfectly rendered app without React knowing anything is wrong.
            A test — and a person reading a session on a handset that
            misbehaved — can now read the answer instead of inferring it.
          */
          try {
            window.__FIQ_BOOT__ = {
              dismissed: true,
              reason: String(reason).slice(0, 80),
              at: Math.round(performance.now())
            };
            window.__FIQ_TIMELINE__.push({ stage: "BOOT_OVERLAY_REMOVED", at: Math.round(performance.now()) });
          } catch (e) {}

          var root = document.getElementById("root");
          if (root) watchForCollapse(root);
          void reason;
        }

        /**
         * THE SHELL DISMISSES ITSELF. This is the structural half of the fix.
         *
         * The shell used to come down only when the app called
         * `__FIQ_MOUNTED__`, which made one callback the single point of failure
         * between a rendered app and a visitor being able to see it. When that
         * callback was scheduled with requestAnimationFrame — which does not run
         * while a page is not visible — a page that rendered perfectly well in a
         * background tab or an off-screen webview stayed behind an opaque dark
         * overlay indefinitely. That is a dark screen with no content, and it is
         * what was being reported.
         *
         * Now the shell watches for evidence rather than waiting to be told: if
         * #root has actually been populated, React has rendered and the shell has
         * no business being on screen, whoever did or did not call in. The app's
         * handshake is kept because it is faster and more precise; this is the
         * floor under it.
         *
         * Polled on a plain timer, which is the point — no rAF, no observer, no
         * dependency on anything the failure might have taken with it.
         */
        (function selfDismiss() {
          var ticks = 0;
          var poll = setInterval(function () {
            ticks++;
            var root = document.getElementById("root");
            if (root && root.childElementCount > 0 && (root.textContent || "").trim() !== "") {
              clearInterval(poll);
              window.__FIQ_STAGE__ = window.__FIQ_STAGE__ === STAGES.html ? STAGES.mounted : window.__FIQ_STAGE__;
              dismissShell("self-check saw #root populated");
              return;
            }
            // Give up watching after fifteen seconds. By then the nine-second
            // failsafe has already spoken, and this would only be competing with
            // the recovery screen it put up.
            if (ticks > 60) clearInterval(poll);
          }, 250);
        })();

        window.__FIQ_MOUNTED__ = function () {
          window.__FIQ_STAGE__ = STAGES.mounted;
          dismissShell("app handshake");
        };

        /** Set once the first route has had its data; purely diagnostic. */
        window.__FIQ_READY__ = function () { window.__FIQ_STAGE__ = STAGES.ready; };

        /** Shown by the React error boundary, which owns the screen from then on. */
        window.__FIQ_BOUNDARY__ = function () {
          settled = true;
          if (timer) { clearTimeout(timer); timer = null; }
          if (boot) boot.setAttribute("hidden", "hidden");
        };

        // ------------------------------------------------- asset load failures

        /**
         * Capture phase, because a failed script or stylesheet fires `error` on
         * the element and does not bubble — a plain window.onerror never sees it.
         * This is the listener that catches the stale-deployment case.
         */
        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (!target || target === window) return;
            var tag = target.tagName;
            if (tag !== "SCRIPT" && tag !== "LINK") return;

            note("asset", tag + " " + (target.src || target.href || ""), "");

            // A stylesheet that failed is a shabby page, not a broken one; let
            // the app carry on and render unstyled rather than replacing it.
            if (tag !== "SCRIPT") return;

            // The app's own entry module failed to load or parse. The cause we
            // know of is a shell from a previous deployment, and the fix for
            // that is to load the current one — which a reload does, because
            // the shell is served no-store. Once only.
            if (!reloadAlreadyTried()) {
              location.reload();
              return;
            }
            recover(
              "לא הצלחנו לטעון את המשחק",
              "יש בעיה בטעינת קבצי המשחק. רענון בדרך כלל פותר את זה."
            );
          },
          true
        );

        window.addEventListener("error", function (event) {
          if (event.target && event.target !== window) return;
          note("error", event.message, event.error && event.error.stack);
        });

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason;
          note("unhandledrejection", reason && reason.message ? reason.message : reason, reason && reason.stack);
        });

        // -------------------------------------------------------- the failsafe

        /**
         * Nine seconds.
         *
         * Long enough that a slow phone on a slow network is not told it is
         * broken while it is still working — the measured startup on a throttled
         * connection is a small fraction of this. Short enough that nobody sits
         * in front of a spinner wondering. The failure it covers is the one with
         * no event at all: a bundle that downloads and then never finishes, a
         * promise that never settles, a module that hangs on evaluation.
         */
        timer = setTimeout(function () {
          if (settled) return;
          note("timeout", "startup did not reach REACT_MOUNTED", "");
          recover(
            "הטעינה לוקחת יותר מדי זמן",
            "אפשר לנסות שוב, או לחזור לדף הבית ולהתחיל מחדש."
          );
        }, 9000);
      })();
    </script>

    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
